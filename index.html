<style>
  :root {
    --bg: #071A10;
    --bg2: #0B2A1A;
    --card: rgba(255,255,255,0.05);
    --line: rgba(255,255,255,0.10);
    --ink: #F2F7F4;
    --sub: rgba(242,247,244,0.72);
    --mint: #63CA93;
    --green: #0B8A4B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: radial-gradient(120% 80% at 80% -10%, #12452A 0%, var(--bg) 55%) fixed, var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  [dir="rtl"] body, html[dir="rtl"] body { font-family: "Noto Naskh Arabic", Inter, system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 0; }
  .wordmark { height: 34px; width: auto; display: block; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .langs button {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--sub);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; cursor: pointer;
  }
  .langs button { font-family: Inter, system-ui, sans-serif; }
  .langs button[data-lang="ar"] { font-family: "Noto Naskh Arabic", system-ui, sans-serif; }
  .langs button[aria-pressed="true"] { color: #062413; background: var(--mint); border-color: var(--mint); }

  .hero { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 32px; align-items: center; padding: 48px 0 40px; }
  .tag {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800;
    letter-spacing: .08em; text-transform: uppercase; color: var(--mint);
    border: 1px solid rgba(99,202,147,.35); border-radius: 999px; padding: 6px 14px;
  }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mint); }
  [dir="rtl"] .tag { letter-spacing: 0; }
  h1 { font-size: clamp(36px, 6vw, 60px); line-height: 1.08; margin: 18px 0 14px; font-weight: 800; letter-spacing: -0.02em; }
  [dir="rtl"] h1 { letter-spacing: 0; line-height: 1.3; }
  .sub { font-size: clamp(16px, 2.1vw, 19px); color: var(--sub); margin: 0 0 26px; max-width: 34em; }
  .cta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .cta img { height: 62px; width: auto; display: block; margin: -9px; }
  .note { font-size: 14px; color: var(--sub); }

  .icon-card {
    justify-self: center; width: min(280px, 70vw); aspect-ratio: 1; border-radius: 22%;
    background: linear-gradient(145deg, #1E5739, var(--green) 55%, #06341C);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.12);
    display: grid; place-items: center; overflow: hidden;
  }
  .icon-card img { width: 100%; height: 100%; object-fit: cover; }

  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 8px 0 56px; }
  .feature { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .feature svg { width: 26px; height: 26px; color: var(--mint); display: block; margin-bottom: 12px; }
  .feature h2 { font-size: 17px; margin: 0 0 6px; font-weight: 800; }
  .feature p { font-size: 14.5px; color: var(--sub); margin: 0; }

  footer { border-top: 1px solid var(--line); padding: 22px 0 34px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; justify-content: space-between; font-size: 14px; color: var(--sub); }
  footer nav { display: flex; gap: 18px; flex-wrap: wrap; }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { border-color: var(--mint); }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; padding-top: 28px; text-align: start; }
    .icon-card { width: 140px; grid-row: 1; justify-self: start; }
    .features { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 540px) {
    header { flex-direction: column; align-items: flex-start; }
    .langs { justify-content: flex-start; }
    .features { grid-template-columns: 1fr; }
  }
</style>

  </main>
